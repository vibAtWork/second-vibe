name: aes-gcm-bench image

on:
  push:
    paths:
      - "projects/aes-gcm-bench/**"
      - ".github/workflows/aes-gcm-bench-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (native)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
          projects/aes-gcm-bench/tests/smoke.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/aes-gcm-bench" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: projects/aes-gcm-bench
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=AES-GCM benchmark: Java (SunJCE) vs OpenSSL

      - name: Smoke test (image)
        run: docker run --rm ${{ steps.meta.outputs.image }}:sha-${{ github.sha }} --seconds 0.1 --sizes 64,4096 --keys 128 --no-speed
